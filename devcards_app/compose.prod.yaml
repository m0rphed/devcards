services:
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: devcards
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: devcards
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devcards']
      interval: 5s
      timeout: 5s
      retries: 10
    # No host port published on purpose — only `app` (same docker network)
    # needs to reach it. Use `docker compose -f compose.prod.yaml exec db psql -U devcards`
    # for ad-hoc admin access instead of exposing 5432 to the internet.

  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://devcards:${POSTGRES_PASSWORD}@db:5432/devcards
      ORIGIN: https://devcards.cloudmorph.org
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      HOST: 0.0.0.0
      PORT: 3000
    # No host port published either — only Caddy talks to it, over the
    # docker network, by service name (`app:3000`).

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
